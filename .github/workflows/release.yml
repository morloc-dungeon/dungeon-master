name: Dungeon Release

# Test every demo in the morloc-dungeon org against a morloc version, on both
# Linux and macOS, and (when publishing) bundle the passing demos into a single
# release tarball for `mim demos` to consume.
#
# The gate job runs on both runners with fail-fast off. A failing demo that is
# NOT on `allow-fail` makes `dungeon-master release` exit nonzero, which fails
# that runner; the publish job `needs:` the whole matrix, so a red leg on EITHER
# OS cancels the release automatically -- no cross-runner coordination needed.
# Only the Linux leg bundles (the bundle is OS-agnostic source).
#
# Only a `v*` tag publishes: it gates against the latest compiler release and,
# when both legs are green, attaches the bundle to a `demos-<version>` release
# that `mim demos` pulls. A push to main and a manual dispatch only gate, so
# the corpus is shown green before a tag changes what users pull.

on:
  workflow_dispatch:
    inputs:
      morloc_version:
        description: "morloc version to test against (blank = latest release)"
        required: false
        default: ""
  push:
    branches: [main]   # gate only
    tags: ['v*']       # gate, then publish

permissions:
  contents: write   # the publish job creates a release

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
      # Fault handlers / allocator tweaks mirrored from the morloc CI so a fatal
      # macOS pool crash prints where it died instead of a silent abort.
      PYTHONFAULTHANDLER: "1"
      MallocNanoZone: "0"
      GITHUB_TOKEN: ${{ github.token }}   # lifts the org-enumeration API rate limit

    steps:
      - name: Checkout dungeon-master
        uses: actions/checkout@v4

      - name: Install mim
        run: |
          mkdir -p "$HOME/.local/bin"
          MIM_DEST="$HOME/.local/bin" \
            curl -fsSL https://raw.githubusercontent.com/morloc-project/morloc-manager/main/scripts/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create native morloc environment
        run: |
          # Native backend (--engine none): no container, so this works the same
          # on the Linux and macOS (Apple Silicon) runners. mim provisions morloc
          # and any language toolchain a demo build needs on demand.
          V="${{ inputs.morloc_version }}"
          mim new --non-interactive --engine none --set-default \
            ${V:+--morloc-version "$V"}

      - name: Clone all demos
        run: mim run -- python3 dungeon-master clone

      # Both legs gate; a non-allow-fail failure on either exits nonzero and
      # fails the leg. The bundle is OS-agnostic source, so only the Linux leg
      # of a tag run produces it.
      - name: Gate
        if: runner.os == 'macOS' || !startsWith(github.ref, 'refs/tags/v')
        run: |
          V="${{ inputs.morloc_version }}"
          mim run -- python3 dungeon-master release ${V:+--morloc-version "$V"}

      - name: Gate + bundle (Linux, tag)
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        run: mim run -- python3 dungeon-master release --bundle --out dist

      - name: Upload bundle artifact (Linux, tag)
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: demos-bundle
          path: dist/

  publish:
    needs: gate   # runs only if EVERY gate leg (Linux + macOS) was green
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: demos-bundle
          path: dist/

      - name: Publish release
        run: |
          V="$(sed -n 's/^# morloc-version: //p' dist/manifest.tsv)"
          [ -n "$V" ] || { echo "no morloc-version in manifest"; exit 1; }
          TAG="demos-$V"
          echo "publishing $TAG"
          # Create the release, or replace its assets if the tag already exists.
          # This job has no checkout, so gh cannot infer the repository from git.
          gh release create "$TAG" dist/demos.tar.gz dist/manifest.tsv \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dungeon demos for morloc $V" \
            --notes "Curated morloc-dungeon demos verified against morloc $V (Linux + macOS)." \
          || gh release upload "$TAG" dist/demos.tar.gz dist/manifest.tsv \
               --repo "$GITHUB_REPOSITORY" --clobber
